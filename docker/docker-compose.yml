name: condorlab

services:
  postgres:
    image: postgres:16-alpine
    container_name: condorlab-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-condor_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-condor_secret_1405}
      POSTGRES_DB: ${POSTGRES_DB:-condorlab_db}
    ports:
      - "5432:5432"
    volumes:
      - condorlab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-condor_admin} -d ${POSTGRES_DB:-condorlab_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: condorlab-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-condor_redis_secret}
    ports:
      - "6379:6379"
    volumes:
      - condorlab-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-condor_redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: condorlab-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-condor_s3_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-condor_s3_secret_1405}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - condorlab-minio-data:/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: condorlab-api
    restart: always
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-condor_admin}:${POSTGRES_PASSWORD:-condor_secret_1405}@postgres:5432/${POSTGRES_DB:-condorlab_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-condor_redis_secret}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-condor_jwt_secret_phase_a_key}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: condorlab-web
    restart: always
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  condorlab-postgres-data:
  condorlab-redis-data:
  condorlab-minio-data:
